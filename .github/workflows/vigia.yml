# Vigilante EXTERNO del R630 (21-oct-2026). Corre en los servidores de GitHub, no en el R630:
# si el R630 se apaga, se queda sin internet o se cae el túnel de Cloudflare, esto falla y
# GitHub le manda un correo al dueño del repositorio («Run failed»). Los vigilantes de adentro
# (health-watchdog, Uptime Kuma, avisos por WhatsApp) se caen junto con el servidor.
name: Vigía del R630
on:
  schedule:
    # Minutos «raros»: GitHub se salta corridas a las :00 y :30 cuando está cargado
    # (22-oct: con "*/30" corrió solo 3 veces en 16 horas).
    - cron: "7,37 * * * *"
  workflow_dispatch:            # para probarlo a mano
    inputs:
      probar_alarma:
        description: "Fingir una caída para comprobar que llega el correo"
        type: boolean
        default: false
# Una sola corrida a la vez: la siguiente espera a que termine la anterior.
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    # 22-oct: GitHub se saltaba las tareas programadas (corría cada 3-4 h). Ahora cada corrida REVISA CADA 5 MIN
    # durante ~5 h 45 min (repositorio público: minutos sin costo) y la siguiente programada la releva.
    timeout-minutes: 350
    steps:
      - name: Revisar los servicios cada 5 minutos
        run: |
          set -u
          FIN=$(( $(date +%s) + ${{ inputs.probar_alarma && 60 || 20700 }} ))
          while :; do
          # nombre|dirección: un servicio por túnel y los que mueven dinero.
          SERVICIOS="
          CrediGestión|https://prestamista.connect-c2ts.com/api/health
          Richie (Pizza Richie)|https://pizzarichie-api.connect-c2ts.com/api/salud
          Actas de Entrega|https://actas-api.connect-c2ts.com/api/salud
          Despachos|https://proyectosdespachos-api.connect-c2ts.com/api/salud
          Taller (AutoPartes)|https://taller.connect-c2ts.com/api/health
          Agua en Ruta|https://agua.connect-c2ts.com/api/salud
          Finanzas|https://finanzas.connect-c2ts.com/api/health
          El Doctor|https://eldoctor.connect-c2ts.com/api/health
          Mi Hogar|https://mihogar.connect-c2ts.com/api/health
          Videos de Sierra|https://media.connect-c2ts.com/salud
          "
          if [ "${{ inputs.probar_alarma }}" = "true" ]; then SERVICIOS="$SERVICIOS
          PRUEBA DE ALARMA (no es real)|https://no-existe.connect-c2ts.com/"; fi
          CAIDOS=0
          while IFS='|' read -r NOMBRE URL; do
            NOMBRE=$(echo "$NOMBRE" | xargs); [ -z "$NOMBRE" ] && continue
            # 3 intentos con 20 s entre cada uno: un parpadeo no es una caída.
            OK=0
            for i in 1 2 3; do
              C=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$URL" || echo 000)
              if [ "$C" = "200" ]; then OK=1; break; fi
              sleep 20
            done
            if [ "$OK" = 1 ]; then echo "✅ $NOMBRE"; else echo "❌ $NOMBRE no responde ($C) — $URL"; echo "::error::$NOMBRE no responde ($C)"; CAIDOS=$((CAIDOS+1)); fi
          done <<< "$SERVICIOS"
          if [ "$CAIDOS" -gt 0 ]; then
            echo "## ❌ $(date -u '+%F %H:%M') UTC: $CAIDOS servicio(s) del R630 no responden" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ $(date -u '+%H:%M') UTC todo responde"
          [ "$(date +%s)" -ge "$FIN" ] && break
          sleep 300
          done
          echo "## ✅ Todo respondió durante esta corrida" >> "$GITHUB_STEP_SUMMARY"
